[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LLMInf"
version = "0.1.0"
description = "A lightweight Python library for simplifying LLM inference"
authors = [
{ name = "FID" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
"torch",
"transformers"
]

[tool.setuptools.packages.find]
include = ["LLMInf*"]